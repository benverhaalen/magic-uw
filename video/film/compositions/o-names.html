<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
  <template>
    <style>
      @font-face { font-family: Karma; src: url("assets/fonts/Karma-Medium.ttf") format("truetype"); font-weight: 500; }
      @font-face { font-family: Geist; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      /* Name labels over the split-screen skit: Sean left, Nathaniel right. */
      #onm-root { position: absolute; inset: 0; font-family: Geist, system-ui, sans-serif; color: #fff; }
      .onm-tag { position: absolute; top: 72px; padding: 12px 22px 14px; border-radius: 8px; background: rgba(26, 13, 11, 0.78); border-left: 5px solid #c5050c; }
      .onm-tag .n { font-family: Karma, Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.1; }
      .onm-tag .r { font-size: 20px; color: #faebec; margin-top: 2px; }
      #onm-sean { left: 72px; }
      #onm-nat { left: 1032px; border-left-color: #f7c440; }
    </style>
    <div id="onm-root" data-composition-id="o-names" data-width="1920" data-height="1080">
      <div class="onm-tag" id="onm-sean"><div class="n">Sean</div><div class="r">The average UW–Madison student</div></div>
      <div class="onm-tag" id="onm-nat"><div class="n">Nathaniel</div><div class="r">A student with My Magic UW</div></div>
    </div>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#onm-sean", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.3);
        tl.fromTo("#onm-nat", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.6);
        tl.to(["#onm-sean", "#onm-nat"], { opacity: 0, duration: 0.4 }, 6.4);
        window.__timelines["o-names"] = tl;
      })();
    </script>
  </template>
</body></html>
