<!doctype html>
<html><head><meta charset="UTF-8" /></head><body>
  <template>
    <style>
      @font-face { font-family: Geist; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      #s04-root { position: absolute; inset: 0; font-family: Geist, system-ui, sans-serif; color: #fff4ed; overflow: hidden; }
      #s04-full { position: absolute; left: 80px; top: 60px; width: 1760px; height: 990px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(10, 4, 3, 0.6); }
      #s04-full img { width: 100%; height: 100%; display: block; }
      #s04-hook { position: absolute; left: 110px; top: 150px; width: 700px; font-size: 118px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; }
      /* Real Upcoming panel (2710x654 at 2x), shown at 0.4 of its 2x size; three row strips cascade in. */
      .s04-row { position: absolute; left: 800px; top: 250px; width: 1084px; height: 262px; overflow: hidden; border-radius: 12px; background-image: url("assets/ui/panel-upcoming.png"); background-size: 1084px 262px; background-repeat: no-repeat; }
      #s04-row-0 { clip-path: inset(0 0 72% 0); }
      #s04-row-1 { clip-path: inset(28% 0 44% 0); }
      #s04-row-2 { clip-path: inset(56% 0 0 0); }
      #s04-toast { position: absolute; left: 1150px; top: 620px; width: 700px; padding: 26px 30px; border-radius: 16px; background: #faf8f4; color: #29231f; box-shadow: 0 24px 60px rgba(10, 4, 3, 0.55); display: flex; gap: 20px; }
      #s04-toast svg { width: 40px; height: 40px; flex: none; }
      #s04-toast .c { font-size: 18px; color: #746d66; }
      #s04-toast .t { font-size: 30px; font-weight: 700; margin-top: 4px; }
      #s04-toast .q { font-size: 21px; color: #3a342f; margin-top: 8px; line-height: 1.4; }
      #s04-change { position: absolute; left: 800px; top: 560px; padding: 14px 22px; border-radius: 10px; background: #fff0cc; color: #684714; font-size: 24px; font-weight: 500; }
      .s04-tag { position: absolute; left: 1150px; top: 880px; font-size: 16px; color: #ffe9dd; opacity: 0.8; }
    </style>
    <div id="s04-root" data-composition-id="s04-home" data-width="1920" data-height="1080">
      <div id="s04-full"><img src="assets/ui/home.png" alt="" /></div>
      <div id="s04-hook">Your day, ranked.</div>
      <div id="s04-row-0" class="s04-row"></div>
      <div id="s04-row-1" class="s04-row"></div>
      <div id="s04-row-2" class="s04-row"></div>
      <div id="s04-change">Exam 2 · moved to Friday · from the announcement</div>
      <div id="s04-toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ae412e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
        <div>
          <div class="c">Algorithms 301 · Sample · Announcement</div>
          <div class="t">Exam 2 moved to Friday</div>
          <div class="q">“Exam 2 now takes place on Friday in the usual room. Coverage is unchanged.”</div>
        </div>
      </div>
      <div class="s04-tag" id="s04-tag">Stand-in: the notice and change note show the synthetic announcement; the app's own change view is being wired</div>
    </div>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        // Full Home, then punch in: the window falls away and the ranked rows cascade in.
        tl.fromTo("#s04-full", { scale: 1, opacity: 1 }, { scale: 1.25, opacity: 0, duration: 0.55, ease: "expo.in" }, 0.5);
        ["#s04-row-0", "#s04-row-1", "#s04-row-2"].forEach((id, i) => {
          tl.fromTo(id, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.9 + i * 0.16);
        });
        tl.fromTo("#s04-hook", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.8);
        // The notice drops in, and the change is noted.
        tl.fromTo("#s04-toast", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 4.2);
        tl.fromTo("#s04-tag", { opacity: 0 }, { opacity: 0.8, duration: 0.4 }, 4.5);
        tl.fromTo("#s04-change", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 5.4);
        window.__timelines["s04-home"] = tl;
      })();
    </script>
  </template>
</body></html>
