      (() => {

        tl.fromTo("#p11-lock", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 6.9);
        tl.fromTo("#p11-shackle", { y: -8 }, { y: 0, duration: 0.3, ease: "back.out(3)" }, 7.2);
        window.__timelines["p11-tiers"] = tl;
      })();
