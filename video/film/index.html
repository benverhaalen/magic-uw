<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>My Magic UW: submission film</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: Geist; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1a0d0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Geist, system-ui, sans-serif; }
      .slot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ground { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 18% 12%, #7a2a22 0%, transparent 60%), radial-gradient(ellipse 70% 60% at 90% 100%, #4a1014 0%, transparent 65%), #1a0d0b; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!--
      Timeline (seconds):
        0-20    skit slot         assets/skit.mp4 (filmed by the team)
        20-90   showcase          nine scenes, Ben's voiceover in assets/narration.wav
        90-120  presenters slot   assets/presenters.mp4 with overlays on the right 45%
      Captions are burned in from script.json (compositions/captions.html, generated by tools/audio.mjs).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="120" data-width="1920" data-height="1080">
      <!-- 0:00-0:20 skit slot -->
      <video id="skit" class="slot clip" src="assets/skit.mp4" data-start="0" data-duration="20" data-track-index="0" muted playsinline></video>
      <audio id="skit-audio" src="assets/skit.mp4" data-start="0" data-duration="20" data-track-index="20" data-volume="1"></audio>

      <!-- 0:20-1:30 showcase ground -->
      <div id="ground" class="clip" data-start="20" data-duration="70" data-track-index="1"></div>

      <div id="s01-whiz" class="scene" data-composition-id="s01-whiz" data-composition-src="compositions/s01-whiz.html" data-start="20" data-duration="3" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s02-onboard" class="scene" data-composition-id="s02-onboard" data-composition-src="compositions/s02-onboard.html" data-start="23" data-duration="6" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s03-spell" class="scene" data-composition-id="s03-spell" data-composition-src="compositions/s03-spell.html" data-start="29" data-duration="9" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s04-home" class="scene" data-composition-id="s04-home" data-composition-src="compositions/s04-home.html" data-start="38" data-duration="8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s05-item" class="scene" data-composition-id="s05-item" data-composition-src="compositions/s05-item.html" data-start="46" data-duration="7" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s06-quiz" class="scene" data-composition-id="s06-quiz" data-composition-src="compositions/s06-quiz.html" data-start="53" data-duration="9" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s07-analytics" class="scene" data-composition-id="s07-analytics" data-composition-src="compositions/s07-analytics.html" data-start="62" data-duration="9" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s08-guard" class="scene" data-composition-id="s08-guard" data-composition-src="compositions/s08-guard.html" data-start="71" data-duration="8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s09-proof" class="scene" data-composition-id="s09-proof" data-composition-src="compositions/s09-proof.html" data-start="79" data-duration="11" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- 1:30-2:00 presenters slot, overlays on the right 45% -->
      <video id="presenters" class="slot clip" src="assets/presenters.mp4" data-start="90" data-duration="30" data-track-index="0" muted playsinline></video>
      <audio id="presenters-audio" src="assets/presenters.mp4" data-start="90" data-duration="30" data-track-index="21" data-volume="1"></audio>
      <div id="p10-layer" class="scene" data-composition-id="p10-layer" data-composition-src="compositions/p10-layer.html" data-start="90" data-duration="12" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="p11-tiers" class="scene" data-composition-id="p11-tiers" data-composition-src="compositions/p11-tiers.html" data-start="102" data-duration="10" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="p12-end" class="scene" data-composition-id="p12-end" data-composition-src="compositions/p12-end.html" data-start="112" data-duration="8" data-track-index="3" data-width="1920" data-height="1080"></div>

      <!-- captions, always on -->
      <div id="captions-host" class="scene" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="120" data-track-index="9" data-width="1920" data-height="1080"></div>

      <!-- sound: voice slot, TEMP on-camera guide (silent once footage lands), ducked music bed, SFX -->
      <audio id="narration" src="assets/narration.wav" data-start="0" data-duration="120" data-track-index="22" data-volume="1"></audio>
      <audio id="dialogue-guide" src="assets/dialogue-guide.wav" data-start="0" data-duration="120" data-track-index="23" data-volume="0.9"></audio>
      <audio id="music" src="assets/music-bed.wav" data-start="0" data-duration="120" data-track-index="24" data-volume="0.35"></audio>

      <audio id="sfx-sparkle-1" src="assets/sfx/sparkle.mp3" data-start="20.4" data-duration="1.80" data-track-index="30" data-volume="0.45"></audio>
      <audio id="sfx-tick-1" src="assets/sfx/click-soft.mp3" data-start="23.7" data-duration="0.37" data-track-index="31" data-volume="0.4"></audio>
      <audio id="sfx-tick-2" src="assets/sfx/click-soft.mp3" data-start="26.9" data-duration="0.37" data-track-index="32" data-volume="0.4"></audio>
      <audio id="sfx-tick-3" src="assets/sfx/click-soft.mp3" data-start="27.6" data-duration="0.37" data-track-index="33" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-stream" src="assets/sfx/whoosh-cinematic.mp3" data-start="29.8" data-duration="4.00" data-track-index="30" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-suck" src="assets/sfx/whoosh.mp3" data-start="32.6" data-duration="0.57" data-track-index="31" data-volume="0.3"></audio>
      <audio id="sfx-pop-snap" src="assets/sfx/pop.mp3" data-start="35.8" data-duration="0.72" data-track-index="32" data-volume="0.5"></audio>
      <audio id="sfx-sparkle-2" src="assets/sfx/sparkle.mp3" data-start="36.4" data-duration="1.80" data-track-index="33" data-volume="0.4"></audio>
      <audio id="sfx-rows" src="assets/sfx/whoosh-short.mp3" data-start="38.9" data-duration="0.57" data-track-index="30" data-volume="0.25"></audio>
      <audio id="sfx-ding" src="assets/sfx/notification.mp3" data-start="42.2" data-duration="2.46" data-track-index="31" data-volume="0.45"></audio>
      <audio id="sfx-line-1" src="assets/sfx/key-press.mp3" data-start="47.6" data-duration="0.40" data-track-index="30" data-volume="0.35"></audio>
      <audio id="sfx-line-2" src="assets/sfx/key-press.mp3" data-start="48.4" data-duration="0.40" data-track-index="31" data-volume="0.35"></audio>
      <audio id="sfx-line-3" src="assets/sfx/key-press.mp3" data-start="49.2" data-duration="0.40" data-track-index="32" data-volume="0.35"></audio>
      <audio id="sfx-ff" src="assets/sfx/riser.mp3" data-start="54.6" data-duration="4.00" data-track-index="30" data-volume="0.25"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.mp3" data-start="58.5" data-duration="2.50" data-track-index="31" data-volume="0.45"></audio>
      <audio id="sfx-chart-1" src="assets/sfx/whoosh-short.mp3" data-start="62.5" data-duration="0.57" data-track-index="30" data-volume="0.25"></audio>
      <audio id="sfx-chart-2" src="assets/sfx/whoosh-short.mp3" data-start="63.6" data-duration="0.57" data-track-index="31" data-volume="0.25"></audio>
      <audio id="sfx-flip-card" src="assets/sfx/whoosh-short.mp3" data-start="67.8" data-duration="0.57" data-track-index="32" data-volume="0.4"></audio>
      <audio id="sfx-clang-1" src="assets/sfx/impact-bass-1.mp3" data-start="72.3" data-duration="2.12" data-track-index="30" data-volume="0.4"></audio>
      <audio id="sfx-zap-1" src="assets/sfx/glitch-1.mp3" data-start="73.5" data-duration="2.64" data-track-index="31" data-volume="0.3"></audio>
      <audio id="sfx-clang-2" src="assets/sfx/impact-bass-1.mp3" data-start="74.7" data-duration="2.12" data-track-index="32" data-volume="0.4"></audio>
      <audio id="sfx-lock" src="assets/sfx/click-soft.mp3" data-start="77.3" data-duration="0.37" data-track-index="33" data-volume="0.5"></audio>
      <audio id="sfx-flip-1" src="assets/sfx/whoosh-short.mp3" data-start="79.3" data-duration="0.57" data-track-index="30" data-volume="0.4"></audio>
      <audio id="sfx-flip-2" src="assets/sfx/whoosh-short.mp3" data-start="82.0" data-duration="0.57" data-track-index="31" data-volume="0.4"></audio>
      <audio id="sfx-flip-3" src="assets/sfx/whoosh-short.mp3" data-start="84.6" data-duration="0.57" data-track-index="32" data-volume="0.4"></audio>
      <audio id="sfx-flip-4" src="assets/sfx/whoosh-short.mp3" data-start="87.3" data-duration="0.57" data-track-index="33" data-volume="0.4"></audio>
      <audio id="sfx-snap-1" src="assets/sfx/pop.mp3" data-start="96.8" data-duration="0.72" data-track-index="30" data-volume="0.35"></audio>
      <audio id="sfx-snap-2" src="assets/sfx/pop.mp3" data-start="98.2" data-duration="0.72" data-track-index="31" data-volume="0.35"></audio>
      <audio id="sfx-snap-3" src="assets/sfx/pop.mp3" data-start="99.6" data-duration="0.72" data-track-index="32" data-volume="0.35"></audio>
      <audio id="sfx-lock-2" src="assets/sfx/click-soft.mp3" data-start="109.2" data-duration="0.37" data-track-index="30" data-volume="0.45"></audio>
      <audio id="sfx-sparkle-end" src="assets/sfx/sparkle.mp3" data-start="112.4" data-duration="1.80" data-track-index="31" data-volume="0.35"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
