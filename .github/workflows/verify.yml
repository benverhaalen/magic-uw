name: Verify workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Performance budgets on their own, after the suite. Statement caps, no-growth, payload sizes and
      # Canvas replay counts gate; timing ratios only report here (shared runners are too noisy to gate
      # on time). Locally they gate by default (BUDGETS_TIMING=gate).
      - run: pnpm test:budgets
        env:
          BUDGETS_TIMING: report
      - run: pnpm build
